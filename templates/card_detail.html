{% extends "base.html" %}

{% block title %}{{ card.title }} | Вишлист{% endblock %}

{% block content %}
<div class="container card-detail-container">


    <!-- Заголовок по центру (стиль заголовка) -->
    <h1 class="card-title">{{ card.title }}</h1>

    <!-- Общее описание карточки под заголовком (стандартный текст, жирный) -->
    <p class="card-main-description">{{ card.description }}</p>

    <!-- Нумерованный список -->
    <ol class="card-content-list">
        {% for item in card.content %}
        <li class="list-item">
            <div class="list-item-title">{{ item.title }}</div>
            <div class="list-item-desc">{{ item.description }}</div>
        </li>
        {% endfor %}
    </ol>
</div>
{% endblock %}
